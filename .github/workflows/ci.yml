name: Cloud Native Task Platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/zaffraj-suzanee/cloud-native-task-platform-api

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check application syntax
        run: |
          python -m py_compile backend/app.py

      - name: Run automated tests
        run: |
          python -m pytest tests/test_api.py -v

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t IMAGENAME:{{ github.sha }} .
          docker tag IMAGENAME:{{ github.sha }} $IMAGE_NAME:latest

      - name: Push Docker image
        run: |
          docker push IMAGENAME:{{ github.sha }}
          docker push $IMAGE_NAME:latest

