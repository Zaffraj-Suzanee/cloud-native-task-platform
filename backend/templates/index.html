<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cloud Native Task Platform</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="background">

    <div class="container">

        <!-- Header -->
        <header class="header">
            <div>
                <p class="eyebrow">CLOUD NATIVE PLATFORM</p>
                <h1>Task Manager</h1>
                <p class="subtitle">
                    Manage your tasks with a simple cloud-native application.
                </p>
            </div>

            <div class="status-card">
                <span class="status-dot"></span>
                <span>API Online</span>
            </div>
        </header>


        <!-- Add Task -->
        <section class="add-task-card">

            <h2>Create a New Task</h2>

            <div class="task-input-row">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What needs to be done?"
                    maxlength="200"
                    onkeypress="handleEnter(event)"
                >

                <button onclick="addTask()" class="add-button">
                    + Add Task
                </button>

            </div>

            <p id="message" class="message"></p>

        </section>


        <!-- Statistics -->
        <section class="stats">

            <div class="stat-card purple">
                <div class="stat-icon">📋</div>
                <div>
                    <span>Total Tasks</span>
                    <strong id="totalTasks">0</strong>
                </div>
            </div>

            <div class="stat-card orange">
                <div class="stat-icon">⏳</div>
                <div>
                    <span>Pending</span>
                    <strong id="pendingTasks">0</strong>
                </div>
            </div>

            <div class="stat-card green">
                <div class="stat-icon">✓</div>
                <div>
                    <span>Completed</span>
                    <strong id="completedTasks">0</strong>
                </div>
            </div>

        </section>


        <!-- Tasks -->
        <section class="tasks-section">

            <div class="section-header">
                <div>
                    <h2>My Tasks</h2>
                    <p>Your current tasks</p>
                </div>

                <button onclick="loadTasks()" class="refresh-button">
                    ↻ Refresh
                </button>
            </div>

            <div id="taskList" class="task-list">

                <div class="loading">
                    Loading tasks...
                </div>

            </div>

        </section>


        <!-- Footer -->
        <footer>
            <span>Cloud Native Task Platform</span>
            <span>Flask • PostgreSQL • Kubernetes</span>
        </footer>

    </div>

</div>


<script>

async function loadTasks() {

    const taskList = document.getElementById("taskList");

    try {

        const response = await fetch("/tasks");

        if (!response.ok) {
            throw new Error("Unable to load tasks");
        }

        const tasks = await response.json();

        displayTasks(tasks);

    } catch (error) {

        taskList.innerHTML = `
            <div class="error">
                <div class="error-icon">⚠️</div>
                <h3>Unable to load tasks</h3>
                <p>Please check that the API is running.</p>
            </div>
        `;

        console.error(error);
    }
}


function displayTasks(tasks) {

    const taskList = document.getElementById("taskList");

    const total = tasks.length;

    const completed = tasks.filter(
        task => task.status.toLowerCase() === "completed"
    ).length;

    const pending = total - completed;

    document.getElementById("totalTasks").textContent = total;
    document.getElementById("pendingTasks").textContent = pending;
    document.getElementById("completedTasks").textContent = completed;


    if (tasks.length === 0) {

        taskList.innerHTML = `
            <div class="empty">
                <div class="empty-icon">✨</div>
                <h3>No tasks yet</h3>
                <p>Add your first task above.</p>
            </div>
        `;

        return;
    }


    taskList.innerHTML = tasks.map(task => {

        const isCompleted =
            task.status.toLowerCase() === "completed";

        return `
            <div class="task-card ${isCompleted ? "completed" : ""}">

                <div class="task-main">

                    <div class="task-check ${isCompleted ? "checked" : ""}">
                        ${isCompleted ? "✓" : ""}
                    </div>

                    <div class="task-content">

                        <h3>${escapeHtml(task.title)}</h3>

                        <span class="task-id">
                            Task #${task.id}
                        </span>

                    </div>

                </div>


                <div class="task-actions">

                    <span class="badge ${isCompleted ? "completed-badge" : "pending-badge"}">
                        ${isCompleted ? "Completed" : "Pending"}
                    </span>

                    ${
                        !isCompleted
                        ?
                        `<button
                            class="complete-button"
                            onclick="completeTask(${task.id})"
                        >
                            Complete
                        </button>`
                        :
                        ""
                    }

                    <button
                        class="delete-button"
                        onclick="deleteTask(${task.id})"
                    >
                        Delete
                    </button>

                </div>

            </div>
        `;

    }).join("");
}


async function addTask() {

    const input = document.getElementById("taskInput");

    const title = input.value.trim();

    if (!title) {

        showMessage(
            "Please enter a task title.",
            "error-message"
        );

        input.focus();

        return;
    }


    try {

        const response = await fetch("/tasks", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                title: title,
                status: "pending"
            })

        });


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.error || "Failed to create task"
            );

        }


        input.value = "";

        showMessage(
            "Task added successfully! 🎉",
            "success-message"
        );

        await loadTasks();

    } catch (error) {

        showMessage(
            error.message,
            "error-message"
        );

        console.error(error);
    }
}


async function completeTask(taskId) {

    try {

        const response = await fetch(
            `/tasks/${taskId}`,
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    status: "completed"
                })
            }
        );


        if (!response.ok) {
            throw new Error("Failed to complete task");
        }


        showMessage(
            "Task completed! 🎉",
            "success-message"
        );

        await loadTasks();

    } catch (error) {

        showMessage(
            "Unable to update task.",
            "error-message"
        );

        console.error(error);
    }
}


async function deleteTask(taskId) {

    if (!confirm("Are you sure you want to delete this task?")) {
        return;
    }


    try {

        const response = await fetch(
            `/tasks/${taskId}`,
            {
                method: "DELETE"
            }
        );


        if (!response.ok) {
            throw new Error("Failed to delete task");
        }


        showMessage(
            "Task deleted.",
            "success-message"
        );

        await loadTasks();

    } catch (error) {

        showMessage(
            "Unable to delete task.",
            "error-message"
        );

        console.error(error);
    }
}


function handleEnter(event) {

    if (event.key === "Enter") {
        addTask();
    }
}


function showMessage(text, className) {

    const message = document.getElementById("message");

    message.textContent = text;

    message.className = `message ${className}`;


    setTimeout(() => {

        message.textContent = "";
        message.className = "message";

    }, 3000);
}


function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


// Load tasks when page opens
loadTasks();

</script>

</body>
</html>
